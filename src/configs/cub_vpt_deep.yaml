experiment_name: cub_vpt_deep
output_dir: outputs/cub_vpt_deep

dataset:
  root: data/cub200/CUB_200_2011
  image_size: 224

training:
  batch_size: 16
  num_workers: 0          # required for Windows stability
  num_epochs: 30          # как у VPT-Shallow, честное сравнение
  lr: 0.0003
  weight_decay: 0.01
  device: cuda
  label_smoothing: 0.1
  seed: 42

model:
  type: vit_vpt_deep
  num_classes: 200
  pretrained: true
  num_prompts: 10
