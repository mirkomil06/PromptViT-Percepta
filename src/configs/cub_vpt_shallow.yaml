experiment_name: cub_vpt_shallow
output_dir: outputs/cub_vpt_shallow

dataset:
  root: data/cub200/CUB_200_2011
  image_size: 224

training:
  batch_size: 16
  num_epochs: 5
  lr: 3e-4
  weight_decay: 0.01
  num_workers: 4
  seed: 42

model:
  type: vit_vpt_shallow
  num_classes: 200
  pretrained: true
  num_prompts: 10
